name: DeveloperRunnerTestHost
options:
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
packages:
  FoundationEvalsPortable:
    path: ../..
targets:
  DeveloperRunnerTestHost:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Info.plist
          - Info-macOS.plist
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Runner Test Host
        NSBonjourServices:
          - _fnd-evals._tcp
        NSLocalNetworkUsageDescription: Connect this isolated verification host to Foundation Evals on the development Mac.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maniacmario.FoundationEvalsDeveloperTestHost
        PRODUCT_NAME: DeveloperRunnerTestHost
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 6.0
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: FoundationEvalsPortable
        product: FoundationEvalsDeveloper
  DeveloperRunnerTestHostMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - Info.plist
          - Info-macOS.plist
    info:
      path: Sources/Info-macOS.plist
      properties:
        CFBundleDisplayName: Runner Test Host
        NSBonjourServices:
          - _fnd-evals._tcp
        NSLocalNetworkUsageDescription: Connect this isolated verification host to Foundation Evals on the development Mac.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maniacmario.FoundationEvalsDeveloperTestHost.mac
        PRODUCT_NAME: DeveloperRunnerTestHostMac
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 6.0
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: FoundationEvalsPortable
        product: FoundationEvalsDeveloper
