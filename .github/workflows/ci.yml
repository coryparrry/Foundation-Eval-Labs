name: CI

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile app and tests
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers
      - name: Check scripts and examples
        run: |
          for script in script/*.sh; do bash -n "$script"; done
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for path in Path('examples').rglob('*.py'):
              ast.parse(path.read_text(), filename=str(path))
          PY
      # The Xcode 27 hosted image runs macOS 26; this app needs macOS 27.
      # Compile both test targets here; execute tests on a macOS 27 machine.
      - name: Build app and test bundles
        run: |
          xcodebuild build-for-testing \
            -project FoundationEvals/FoundationEvals.xcodeproj \
            -scheme FoundationEvals \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO
