name: Release verification

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft or published release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-verification-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify signed installer
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Always execute the protected verifier, including manual dispatches.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify source checks and downloaded installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          EXPECTED_TEAM_ID: 3Z3955EFRE
        run: bash script/verify_release.sh
