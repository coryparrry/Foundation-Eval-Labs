name: Release Me

on:
  workflow_dispatch:
    inputs:
      tag:
        description: New release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      build_number:
        description: Positive build number, higher than the previous release
        required: true
        type: string
      publish:
        description: Publish after verification (otherwise create a draft)
        default: false
        type: boolean
      native_tested:
        description: I verified this source on macOS 27, including real model generation
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-me
  cancel-in-progress: false

jobs:
  release:
    name: Build, notarize, and prepare release
    runs-on: xcode-27
    environment: release
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      PUBLISH_RELEASE: ${{ inputs.publish }}
      NATIVE_TESTED: ${{ inputs.native_tested }}
      RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
      APPLE_TEAM_ID: 3Z3955EFRE
      EXPECTED_TEAM_ID: 3Z3955EFRE
    steps:
      - name: Require the default branch
        env:
          EXPECTED_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "$EXPECTED_REF" ]]; then
            echo 'Run Release Me from the default branch after its CI passes.' >&2
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check signing configuration
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          missing=0
          for name in CERTIFICATE_P12_BASE64 CERTIFICATE_PASSWORD NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure $name in the release environment (see docs/releasing.md)."
              missing=1
            fi
          done
          exit "$missing"
      - name: Validate candidate and exact source CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash script/release_dispatch.sh prepare
      - name: Build, sign, notarize, and verify installer
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: bash script/release.sh
      - name: Create and verify GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash script/release_dispatch.sh publish
