name: Release Me

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-me
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      source_sha: ${{ steps.release.outputs.sha }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Stage merged release as draft
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true
      - name: Check the published release baseline
        id: baseline
        if: steps.release.outputs.release_created != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 script/release_pr.py check-baseline
      - name: Create or update the release PR
        id: release_pr
        if: steps.baseline.outputs.ready == 'true'
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
      # GITHUB_TOKEN-created PRs do not emit CI-triggering pull_request events.
      - name: Run CI on the release PR
        if: steps.release_pr.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRS: ${{ steps.release_pr.outputs.prs || '[]' }}
        run: python3 script/release_pr.py dispatch-ci

  installer:
    name: Build DMG and publish release
    needs: release
    if: needs.release.outputs.release_created == 'true'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/package-installer.yml
    with:
      tag: ${{ needs.release.outputs.tag_name }}
      source_sha: ${{ needs.release.outputs.source_sha }}
    secrets: inherit
